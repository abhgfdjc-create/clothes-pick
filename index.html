
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옷 골라줘 ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #faf9f7;
  color: #242424;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

body.modal-open {
  overflow: hidden;
}

header {
  text-align: center;
  padding: 55px 15px 32px;
}

header h1 {
  font-size: 30px;
  letter-spacing: 2px;
  margin: 0 0 12px;
}

header p {
  color: #777;
  font-size: 14px;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 0 16px 130px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.item {
  background: white;
  border: 2px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 2px 10px #00000008;
  transition: border-color 0.2s;
}

.item.selected {
  border-color: #e76888;
}

.image-wrap {
  position: relative;
}

.item img {
  display: block;
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: #eee;
  cursor: zoom-in;
}

.info {
  padding: 14px 8px;
  text-align: center;
}

.info strong {
  font-size: 14px;
  line-height: 1.5;
}

.heart {
  position: absolute;
  right: 12px;
  top: 12px;
  background: white;
  color: #242424;
  border: 0;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 2px 6px #00000015;
  z-index: 2;
}

.item.selected .heart {
  color: #e76888;
}

.heart:focus-visible,
.close-modal:focus-visible,
.item img:focus-visible {
  outline: 3px solid #e76888;
  outline-offset: 2px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: white;
  padding: 15px;
  box-shadow: 0 -3px 18px #00000012;
  text-align: center;
  z-index: 100;
}

.submit-btn {
  border: 0;
  background: #222;
  color: white;
  padding: 15px 35px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  width: min(100%, 450px);
}

/* 사진 확대 화면 */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.85);
  align-items: center;
  justify-content: center;
  padding: 55px 16px 40px;
}

.modal.active {
  display: flex;
}

.modal-content {
  position: relative;
  max-width: min(95vw, 850px);
  max-height: calc(100vh - 100px);
  max-height: calc(100dvh - 100px);
}

.modal-content img {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 100px);
  max-height: calc(100dvh - 100px);
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 8px;
}

.close-modal {
  position: absolute;
  top: -45px;
  right: 0;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  background: white;
  color: #222;
  font-size: 25px;
  cursor: pointer;
  display: grid;
  place-items: center;
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>CLOSET PICK ♡</h1>
  <p>마음에 드는 옷을 골라줘!</p>
  <p>여러 개 선택해도 돼 ♡</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="bottom">
  <button
    type="button"
    class="submit-btn"
    onclick="sendSelection()"
  >
    선택 완료 (<span id="count">0</span>개)
  </button>
</div>

<!-- 사진 확대 화면 -->
<div
  class="modal"
  id="imageModal"
  role="dialog"
  aria-modal="true"
  aria-label="옷 사진 크게 보기"
  aria-hidden="true"
>
  <div class="modal-content">
    <button
      type="button"
      class="close-modal"
      id="closeModal"
      aria-label="닫기"
    >×</button>

    <img id="modalImage" alt="">
  </div>
</div>

<script>

// 기존 옷 19개 - 순서 유지
const clothes = [
  "숏패딩",
  "논퀄팅 패딩",
  "양털 패딩",
  "떡볶이 패딩",
  "하프 코트",
  "항공점퍼",
  "양털자켓",
  "코듀로이 자켓",
  "퍼안감 데님자켓",
  "스웨이드 자켓",
  "빈티지 후드자켓",
  "누빔자켓",
  "데님자켓",
  "바람막이",
  "가디건니트",
  "울크롭니트",
  "하찌 라운드니트",
  "꽈배기 스웨터",
  "배색 가디건 니트"
];

const grid = document.getElementById("grid");
const selected = new Set();

const modal = document.getElementById("imageModal");
const modalImage = document.getElementById("modalImage");
const closeButton = document.getElementById("closeModal");

let previousFocus = null;

// 사진 확대
function openImage(src, name) {
  previousFocus = document.activeElement;

  modalImage.src = src;
  modalImage.alt = name;

  modal.classList.add("active");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");

  closeButton.focus();
}

// 사진 닫기
function closeImage() {
  modal.classList.remove("active");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");

  modalImage.removeAttribute("src");

  if (previousFocus && previousFocus.focus) {
    previousFocus.focus();
  }
}

// X 버튼으로 닫기
closeButton.addEventListener("click", closeImage);

// 사진 바깥 어두운 배경 클릭 시 닫기
modal.addEventListener("click", function(event) {
  if (event.target === modal) {
    closeImage();
  }
});

// ESC 키로 닫기
document.addEventListener("keydown", function(event) {
  if (!modal.classList.contains("active")) return;

  if (event.key === "Escape") {
    closeImage();
  }

  // 확대 창 안에서 키보드 포커스 유지
  if (event.key === "Tab") {
    event.preventDefault();
    closeButton.focus();
  }
});


// 사진 카드 생성
clothes.forEach((name, index) => {

  const num = String(index + 1).padStart(2, "0");
  const id = index + 1;

  const card = document.createElement("div");
  card.className = "item";

  const imageWrap = document.createElement("div");
  imageWrap.className = "image-wrap";

  // 하트 버튼 - 선택 전용
  const heart = document.createElement("button");
  heart.type = "button";
  heart.className = "heart";
  heart.textContent = "♡";
  heart.setAttribute("aria-label", `${name} 선택`);
  heart.setAttribute("aria-pressed", "false");

  // 사진 - 확대 전용
  const img = document.createElement("img");

  // 사진은 GitHub 저장소 최상위에 있음
  img.src = `./${num}.png`;
  img.alt = name;
  img.loading = "lazy";
  img.tabIndex = 0;
  img.setAttribute("role", "button");
  img.setAttribute("aria-label", `${name} 사진 크게 보기`);

  const placeholder = document.createElement("div");
  placeholder.style.cssText =
    "display:none;aspect-ratio:3/4;" +
    "background:#eee;place-items:center;" +
    "color:#888;font-size:13px;";

  placeholder.textContent = "사진 준비 중";

  img.onerror = () => {
    img.style.display = "none";
    placeholder.style.display = "grid";
  };

  // 사진을 누르면 확대만 실행
  img.addEventListener("click", () => {
    openImage(img.src, name);
  });

  // 키보드에서도 확대 가능
  img.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openImage(img.src, name);
    }
  });

  // 하트를 누르면 선택만 실행
  heart.addEventListener("click", () => {

    if (selected.has(id)) {
      selected.delete(id);
      card.classList.remove("selected");
      heart.textContent = "♡";
      heart.setAttribute("aria-pressed", "false");
      heart.setAttribute("aria-label", `${name} 선택`);
    } else {
      selected.add(id);
      card.classList.add("selected");
      heart.textContent = "♥";
      heart.setAttribute("aria-pressed", "true");
      heart.setAttribute("aria-label", `${name} 선택 해제`);
    }

    document.getElementById("count").textContent =
      selected.size;
  });

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("strong");
  title.textContent = `${id}번 ${name}`;

  info.appendChild(title);

  imageWrap.appendChild(img);
  imageWrap.appendChild(placeholder);
  imageWrap.appendChild(heart);

  card.appendChild(imageWrap);
  card.appendChild(info);

  grid.appendChild(card);
});


// 선택 결과 공유
async function sendSelection() {

  if (selected.size === 0) {
    alert("마음에 드는 옷을 먼저 골라줘!");
    return;
  }

  const items = [...selected].sort((a, b) => a - b);

  const message =
    "♡ 내가 고른 옷 ♡\n\n" +
    items.map(id =>
      `${id}번 ${clothes[id - 1]}`
    ).join("\n") +
    "\n\n총 " + items.length + "개 선택했어!";

  // 휴대폰 기본 공유 메뉴
  if (navigator.share) {
    try {
      await navigator.share({
        title: "내가 고른 옷 ♡",
        text: message
      });
      return;
    } catch (error) {
      if (error.name === "AbortError") {
        return;
      }
    }
  }

  // 공유 미지원 시 복사
  try {
    await navigator.clipboard.writeText(message);

    alert(
      "선택한 옷 목록이 복사됐어!\n" +
      "카카오톡에 붙여넣어 줘 ♡"
    );

  } catch (error) {
    prompt(
      "아래 내용을 복사해서 카카오톡으로 보내줘.",
      message
    );
  }
}

</script>
</body>
</html>
