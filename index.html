
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>옷 골라줘 ♡</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #faf9f7;
  color: #242424;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

header {
  text-align: center;
  padding: 55px 15px 32px;
}

header h1 {
  font-size: 30px;
  letter-spacing: 2px;
  margin: 0 0 12px;
}

header p {
  color: #777;
  font-size: 14px;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 0 16px 130px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.item {
  background: white;
  border: 2px solid transparent;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  box-shadow: 0 2px 10px #00000008;
  transition: 0.2s;
}

.item.selected {
  border-color: #e76888;
}

.item img {
  display: block;
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: #eee;
}

.info {
  padding: 14px 8px;
  text-align: center;
}

.info strong {
  font-size: 14px;
  line-height: 1.5;
}

.heart {
  position: absolute;
  right: 12px;
  top: 12px;
  background: white;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  font-size: 20px;
  box-shadow: 0 2px 6px #00000015;
}

.selected .heart {
  color: #e76888;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: white;
  padding: 15px;
  box-shadow: 0 -3px 18px #00000012;
  text-align: center;
  z-index: 100;
}

button {
  border: 0;
  background: #222;
  color: white;
  padding: 15px 35px;
  border-radius: 8px;
  font-size: 15px;
  cursor: pointer;
  width: min(100%, 450px);
}

@media (min-width: 700px) {
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

</style>
</head>

<body>

<header>
  <h1>CLOSET PICK ♡</h1>
  <p>마음에 드는 옷을 골라줘!</p>
  <p>여러 개 선택해도 돼 ♡</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="bottom">
  <button type="button" onclick="sendSelection()">
    선택 완료 (<span id="count">0</span>개)
  </button>
</div>

<script>

// 옷 목록: 원하는 표시 순서
const clothes = [
  "숏패딩",
  "논퀄팅 패딩",
  "양털 패딩",
  "떡볶이 패딩",
  "하프 코트",
  "항공점퍼",
  "양털자켓",
  "코듀로이 자켓",
  "퍼안감 데님자켓",
  "스웨이드 자켓",
  "빈티지 후드자켓",
  "누빔자켓",
  "데님자켓",
  "바람막이",
  "가디건니트",
  "울크롭니트",
  "하찌 라운드니트",
  "꽈배기 스웨터",
  "배색 가디건 니트"
];

const grid = document.getElementById("grid");
const selected = new Set();

// 사진 카드 생성
clothes.forEach((name, index) => {

  const num = String(index + 1).padStart(2, "0");
  const id = index + 1;

  const card = document.createElement("div");
  card.className = "item";

  const heart = document.createElement("span");
  heart.className = "heart";
  heart.textContent = "♡";

  const img = document.createElement("img");
  img.src = `./${num}.png`;
  img.alt = name;
  img.loading = "lazy";

  const placeholder = document.createElement("div");
  placeholder.style.cssText =
    "display:none;aspect-ratio:3/4;background:#eee;" +
    "place-items:center;color:#888;font-size:13px;";
  placeholder.textContent = "사진 준비 중";

  img.onerror = () => {
    img.style.display = "none";
    placeholder.style.display = "grid";
  };

  const info = document.createElement("div");
  info.className = "info";

  const title = document.createElement("strong");
  title.textContent = `${id}번 ${name}`;

  info.appendChild(title);

  card.appendChild(heart);
  card.appendChild(img);
  card.appendChild(placeholder);
  card.appendChild(info);

  // 선택 및 해제
  card.onclick = () => {

    if (selected.has(id)) {
      selected.delete(id);
      card.classList.remove("selected");
      heart.textContent = "♡";
    } else {
      selected.add(id);
      card.classList.add("selected");
      heart.textContent = "♥";
    }

    document.getElementById("count").textContent =
      selected.size;
  };

  grid.appendChild(card);
});


// 카카오톡 등으로 공유
async function sendSelection() {

  if (selected.size === 0) {
    alert("마음에 드는 옷을 먼저 골라줘!");
    return;
  }

  const items = [...selected].sort((a, b) => a - b);

  const message =
    "♡ 내가 고른 옷 ♡\n\n" +
    items.map(id =>
      `${id}번 ${clothes[id - 1]}`
    ).join("\n") +
    "\n\n총 " + items.length + "개 선택했어!";

  // 모바일 기본 공유 메뉴
  if (navigator.share) {
    try {
      await navigator.share({
        title: "내가 고른 옷 ♡",
        text: message
      });
      return;
    } catch (error) {
      if (error.name === "AbortError") {
        return;
      }
    }
  }

  // 공유 메뉴 미지원 시 복사
  try {
    await navigator.clipboard.writeText(message);

    alert(
      "선택한 옷 목록이 복사됐어!\n" +
      "카카오톡에 붙여넣어 줘 ♡"
    );

  } catch (error) {
    prompt(
      "아래 내용을 복사해서 카카오톡으로 보내줘.",
      message
    );
  }
}

</script>

</body>
</html>
